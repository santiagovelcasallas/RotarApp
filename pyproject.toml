[project]
name = "rotarapp"
version = "0.1.0"
description = "Apoyo a decisiones de rotación de cultivos agroecológica con datos NASA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "pyproj>=3.6"]
dev = ["pytest>=8"]
modelo = ["scikit-learn>=1.4", "matplotlib>=3.8", "scipy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
